name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install pinned toolchain (1.97.1, rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: run the deterministic gate
        run: scripts/verify.sh
      - name: diagnostic — full test output when the gate fails
        if: failure()
        run: cargo test --all 2>&1 | grep -B 2 -A 12 -E "FAILED|panicked at|failures:" | head -60
      - name: supply-chain check (cargo-deny)
        # A plain shell step (the cargo-deny action's container conflicts
        # with the pinned rust-toolchain.toml on musl hosts).
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories licenses bans

  release-build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: cargo build --release --locked
