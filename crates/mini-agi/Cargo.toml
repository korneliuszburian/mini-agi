[package]
name = "mini-agi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mini-agi: single-binary agent kernel — memory, evals, skills, orchestration (CLI + MCP server)"
readme = "README.md"
keywords = ["agent", "memory", "evaluation", "mcp", "skill"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/krn/mini-agi"

[dependencies]
mini-agi-core = { path = "../mini-agi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
