[package]
name = "mini-agi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mini-agi: single-binary agent kernel — memory, evals, skills, orchestration (CLI + MCP server)"
readme = "README.md"
keywords = ["agent", "memory", "evaluation", "mcp", "skill"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/korneliuszburian/mini-agi"

[dependencies]
mini-agi-core = { path = "../mini-agi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Worker sandbox (ADR-0012): Landlock write-containment for the
# codex/hitl worker. Linux-only; the kernel crate stays std-only.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Mirrors the workspace lints (a `lints.workspace = true` cannot be
# combined with an override), plus `multiple_crate_versions = "allow"`:
# the landlock crate (ADR-0012) pulls a second `syn` major into the dev
# tree — a benign version spread clippy flags globally.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
must_use_candidate = "warn"
missing_errors_doc = "warn"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
